name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install -e '.[dev,collect]'
      - run: python -m pytest -q
      - run: python -m ruff check .
