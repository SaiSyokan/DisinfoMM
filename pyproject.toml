[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disinfomm"
version = "1.0.0"
description = "Reproducible tooling for the DisinfoMM multilingual multimodal disinformation dataset"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Shuhan Cui"}]
dependencies = ["PyYAML>=6.0", "Pillow>=10.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "torchvision>=0.16",
  "open-clip-torch>=2.24",
  "transformers>=4.38",
  "multilingual-clip>=1.0.10",
  "tqdm>=4.66",
]
collect = ["beautifulsoup4>=4.12", "requests>=2.31"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
disinfomm = "disinfomm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
